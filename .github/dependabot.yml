version: 2

# Weekly, with a 7-day cooldown so a release is not pulled in the moment it is
# published (a compromised or yanked version usually surfaces within days).
# Minor and patch updates share one grouped PR per ecosystem; each major
# update gets its own PR. There is no auto-merge: every Dependabot PR goes
# through the same gates and review as any other.

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The fixture project the evals index; its lockfile is scanned by
  # OSV-Scanner and dependency review too.
  - package-ecosystem: "npm"
    directory: "/evals/fixtures/node-oidc"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
