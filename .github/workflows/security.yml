name: Security

# No `branches:` filter on pull_request: stacked PRs target other feature
# branches and still need every gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are required-check contexts in oss-admin terraform/codecite.
# Renaming one breaks merges until the Terraform changes too.
jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security: false makes findings fail this job instead of only
      # reaching the Security tab. Config comes from .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          persona: regular
          min-severity: low
