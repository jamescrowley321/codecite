name: Security

# No `branches:` filter on pull_request: stacked PRs target other feature
# branches and still need every gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are required-check contexts in oss-admin terraform/codecite.
# Renaming one breaks merges until the Terraform changes too.
jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security: false makes findings fail this job instead of only
      # reaching the Security tab. Config comes from .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          persona: regular
          min-severity: low

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the PR's commits, which bound the scan
    steps:
      # Full history, so the scan covers every commit a PR brings in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The only secret is GITHUB_TOKEN: a personal-account repository needs
      # no GITLEAKS_LICENSE, so fork PRs (which get no other secrets) still
      # run it. Planted test fixtures are ignored by fingerprint in
      # .gitleaksignore. GITLEAKS_VERSION pins the scanner to the one used
      # locally; the action's own default is older.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
