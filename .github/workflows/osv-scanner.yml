name: OSV-Scanner

# Scans every lockfile in the repository recursively against the OSV
# database: Cargo.lock, the documentation site's website/package-lock.json,
# the eval fixture's package-lock.json and the uv lockfiles. No `branches:` filter on pull_request, so stacked PRs are scanned too.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "53 7 * * 1" # weekly, Monday 07:53 UTC

permissions: {}

jobs:
  # PR diff scan: fails only on vulnerabilities the PR newly introduces.
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      security-events: write
      contents: read
      actions: read
      pull-requests: read # resolve PR diff bounds for the scan

  # Full scan on push and schedule: uploads SARIF to the Security tab.
  # fail-on-vuln: false so an advisory already on main doesn't turn main red;
  # cargo deny's advisories check is where those get triaged.
  scan-scheduled:
    if: ${{ github.event_name != 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      fail-on-vuln: false
