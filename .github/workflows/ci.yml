name: CI

# No `branches:` filter on pull_request: stacked PRs target other feature
# branches and still need every gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its stale run; pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Job ids and names are required checks in oss-admin terraform/codecite.
# Renaming one breaks merges until the Terraform changes too.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, rustup >= 1.28 installs what rust-toolchain.toml names.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  evals-test:
    name: evals-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The frozen-task check diffs each task against its frozen_at commit.
          fetch-depth: 0
      - name: Install uv
        run: pipx install uv==0.12.5
      - run: uv run --locked pytest
        working-directory: evals
      # A frozen task's files can't change; on a PR, nor can its frozen_at.
      - name: Check frozen tasks
        working-directory: evals
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --locked codecite-eval-frozen ${BASE_REF:+--base "origin/$BASE_REF"}

  ralph-test:
    name: ralph-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Against a stub gh: no token, no network.
      - run: ralph/tests/wait-review.test.sh

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Not a required check: it reports retrieval quality so a ranking change
  # shows its effect, on the identity benchmark and on the history benchmark
  # across the owner's repositories, and fails only if a benchmark can't run
  # or the spec questions don't check out against the index it builds.
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Documents are pinned by sha256 and the repo by commit, so the
      # cache never goes stale; a manifest change starts a new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/codecite
          key: bench-sources-${{ hashFiles('evals/retrieval/identity-bench.toml', 'evals/history/*/manifest.toml') }}
      - run: cargo build --release --locked -p codecite -p codecite-bench
      - run: target/release/codecite index identity-bench --manifest evals/retrieval/identity-bench.toml
      - name: Run the retrieval benchmark
        run: target/release/codecite-bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install uv
        run: pipx install uv==0.12.5
      # Its unit tests run in evals-test; this checks the set against the index.
      - name: Check the spec questions
        run: uv run --locked python -m codecite_evals.spec_questions
        working-directory: evals
      # The history benchmark: codecite against git grep and the popular-files
      # floor on each mined repository (evals/README.md). A loss on any
      # repository is a finding.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run the history benchmark
        run: |
          status=0
          evals/history/run.sh || status=$?
          cat evals/history/results/scorecard.md >>"$GITHUB_STEP_SUMMARY" ||
            echo "The history scorecard failed to build; see the log." >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Not a required check: it proves an eval task's hidden tests and checks
  # pass its references and fail its planted bad solutions. No model key.
  eval-task:
    name: eval-task (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Replay tasks only in Python and Go, the runner's own toolchains.
        task:
          - backchannel-logout
          - spec-questions
          - replay-identity-model-908
          - replay-identity-stack-449
          - replay-terraform-provider-descope-75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          pipx install uv==0.11.32
          uv --version
      - name: Fetch identity-model at the task's pinned commit
        env:
          TASK: ${{ matrix.task }}
        # A replay task's check.sh needs its own repository at its base
        # instead; the runner's Go and uv run its tests.
        run: |
          task="evals/tasks/$TASK/task.json"
          if [[ "$(jq -r '.kind // ""' "$task")" == replay ]]; then
            git init -q "$RUNNER_TEMP/replay"
            git -C "$RUNNER_TEMP/replay" fetch -q --depth 1 "$(jq -r .url "$task")" "$(jq -r .base "$task")"
            exit 0
          fi
          commit="$(jq -r .corpus.commit "$task")"
          git init -q "$RUNNER_TEMP/identity-model"
          git -C "$RUNNER_TEMP/identity-model" fetch -q --depth 1 https://github.com/jamescrowley321/identity-model "$commit"
      - name: Check the task
        env:
          TASK: ${{ matrix.task }}
        run: IDENTITY_MODEL_REPO="$RUNNER_TEMP/identity-model" REPLAY_REPO="$RUNNER_TEMP/replay" "evals/tasks/$TASK/check.sh"
