name: CI

# No `branches:` filter on pull_request: stacked PRs target other feature
# branches and still need every gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its stale run; pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Job ids and names are required checks in oss-admin terraform/codecite.
# Renaming one breaks merges until the Terraform changes too.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, rustup >= 1.28 installs what rust-toolchain.toml names.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  evals-test:
    name: evals-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.12.5
      - run: uv run --locked pytest
        working-directory: evals

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Not a required check: it reports retrieval quality so a ranking change
  # shows its effect, and fails only if the benchmark can't run or the spec
  # questions don't check out against the index it builds.
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Documents are pinned by sha256 and the repo by commit, so the
      # cache never goes stale; a manifest change starts a new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/codecite
          key: bench-sources-${{ hashFiles('evals/retrieval/identity-bench.toml') }}
      - run: cargo build --release --locked -p codecite -p codecite-bench
      - run: target/release/codecite index identity-bench --manifest evals/retrieval/identity-bench.toml
      - name: Run the retrieval benchmark
        run: target/release/codecite-bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install uv
        run: pipx install uv==0.12.5
      # Its unit tests run in evals-test; this checks the set against the index.
      - name: Check the spec questions
        run: uv run --locked python -m codecite_evals.spec_questions
        working-directory: evals

  # Not a required check: it proves an eval task's hidden tests and checks
  # pass its references and fail its planted bad solutions. No model key.
  eval-task:
    name: eval-task (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [backchannel-logout, spec-questions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          pipx install uv==0.11.32
          uv --version
      - name: Fetch identity-model at the task's pinned commit
        env:
          TASK: ${{ matrix.task }}
        run: |
          commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpus"]["commit"])' "evals/tasks/$TASK/task.json")"
          git init -q "$RUNNER_TEMP/identity-model"
          git -C "$RUNNER_TEMP/identity-model" fetch -q --depth 1 https://github.com/jamescrowley321/identity-model "$commit"
      - name: Check the task
        env:
          TASK: ${{ matrix.task }}
        run: IDENTITY_MODEL_REPO="$RUNNER_TEMP/identity-model" "evals/tasks/$TASK/check.sh"
