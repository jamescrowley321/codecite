name: CI

# No `branches:` filter on pull_request: stacked PRs target other feature
# branches and still need every gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its stale run; pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Job ids and names are required checks in oss-admin terraform/codecite.
# Renaming one breaks merges until the Terraform changes too.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, rustup >= 1.28 installs what rust-toolchain.toml names.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Not a required check: it reports retrieval quality so a ranking change
  # shows its effect, and fails only if the benchmark can't run or the spec
  # questions don't check out against the index it builds.
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Documents are pinned by sha256 and the repo by commit, so the
      # cache never goes stale; a manifest change starts a new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/codecite
          key: bench-sources-${{ hashFiles('evals/retrieval/identity-bench.toml') }}
      - run: cargo build --release --locked -p codecite -p codecite-bench
      - run: target/release/codecite index identity-bench --manifest evals/retrieval/identity-bench.toml
      - name: Run the retrieval benchmark
        run: target/release/codecite-bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the spec questions
        run: |
          python3 -I -m unittest discover -s evals/tasks/spec-questions
          python3 -I evals/tasks/spec-questions/check.py
