name: CodeQL

# No `branches:` filter on pull_request: stacked PRs target other feature
# branches and still need every gate.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

# The matrix job names, `Analyze (actions)` and `Analyze (rust)`, are
# required-check contexts in oss-admin terraform/codecite.
# `Analyze (javascript-typescript)` covers the documentation site's
# TypeScript (config, sidebar, remark plugin), scoped to website/.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: rust
          - language: javascript-typescript
            config: |
              paths:
                - website
              paths-ignore:
                - website/node_modules
                - website/build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every language is analysed from source, so there is no build step.
      # `config` is empty except where a matrix entry scopes the analysis.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: ${{ matrix.config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
