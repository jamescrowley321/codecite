name: Evals

# The A/B agent eval (evals/README.md). The quick tier, the gate run, runs
# when a PR gets the `eval` label, once: pushes don't rerun it, so take the label off and
# put it back, or dispatch, to run it again. It runs one job per task in the
# eval job's matrix and posts their scorecards as one PR comment, updated in
# place; the full tier, the rerun of a pair that lost on quick before it
# blocks, runs on dispatch, for the one task it names.
#
# Every run has Claude Code on the Claude panel, on the subscription behind
# CLAUDE_CODE_OAUTH_TOKEN. pi on the OpenRouter panel, billed per token, runs
# beside it only when a dispatch asks for it with its `openrouter` input; a PR
# run never bills OpenRouter. At most EVALS_DAILY_MAX runs (a repository
# variable, default 6) start in any 24 hours; the budget job refuses the rest,
# and a dispatch can pass ignore_daily_cap to run anyway. A dispatch with `arms: baseline`
# calibrates its task: the quick panel on the baseline arm alone, reported with
# no verdict (evals/README.md). A task with a size dial (house-rules) takes
# `corpus`, its corpus size: s, m or l, empty for its default. Advisory, like
# `bench`: never a required check.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tier:
        description: quick (the gate run, 3 Claude models, 5 epochs) or full (the rerun of a losing pair, 3 Claude models, 10 epochs); OpenRouter adds 3 or 9 models, reported only
        type: choice
        options: [quick, full]
        default: quick
      task:
        description: The task to run, a directory under evals/tasks/
        type: string
        default: fastapi-middleware
      arms:
        description: ab (baseline against codecite), aa (two baseline arms), baseline (calibration), assist (codecite through the search hook), or tools (baseline, codecite and codegraph)
        type: choice
        options: [ab, aa, baseline, assist, tools]
        default: ab
      corpus:
        description: For a task with a size dial (house-rules), its corpus size, s, m or l; empty for the task's default
        type: string
        default: ""
      epochs:
        description: Epochs per arm, if not the tier's own (quick 5, full 10)
        type: string
        default: ""
      openrouter:
        description: Also run pi on the tier's OpenRouter panel, billed per token (the only way to switch OpenRouter on)
        type: boolean
        default: false
      ignore_daily_cap:
        description: Run even if EVALS_DAILY_MAX runs started in the last 24 hours
        type: boolean
        default: false
      resume:
        description: Run id of an earlier run of this tier, task and arms whose unfinished logs to finish with inspect eval-retry
        type: string
        default: ""

permissions:
  contents: read

# Labelling a PR again cancels its stale eval. Events that run nothing (any
# other label) get a group of their own, so they cancel nothing. Dispatches queue rather than cancel, one group per set of
# inputs (task, corpus, tier, arms, epochs, openrouter, resume): GitHub keeps one pending run per
# group and cancels the one before, so without the task, calibrating two tasks
# at once dropped the first. Only an identical dispatch replaces a pending one.
concurrency:
  group: >-
    evals-${{ github.event.pull_request.number || github.ref }}-${{ inputs.task || 'pr' }}-${{ inputs.corpus || 'default' }}-${{ inputs.tier || 'quick' }}-${{ inputs.arms || 'ab' }}-${{ inputs.epochs || 'default' }}-${{ inputs.openrouter && 'or' || 'claude' }}-${{ inputs.resume || 'fresh' }}-${{
    (github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval')
    && 'run' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The daily cap (#297). Counts the runs of this workflow in the last 24
  # hours whose eval job actually started, so runs another label skipped, and
  # runs this job refused, don't count. Over EVALS_DAILY_MAX it fails, which
  # skips the eval job; a dispatch with ignore_daily_cap runs anyway.
  budget:
    name: budget
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.label.name == 'eval')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check the daily eval cap
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ vars.EVALS_DAILY_MAX || '6' }}
          IGNORE: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_daily_cap || false }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=0
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/evals.yml/runs?created=%3E%3D$since&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion != "skipped") | .id'); do
            [ "$id" = "$RUN_ID" ] && continue
            started=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select((.name | startswith("eval")) and .conclusion != "skipped" and .started_at != null)] | length' \
              | awk '{s += $1} END {print s + 0}')
            [ "$started" -gt 0 ] && count=$((count + 1))
          done
          echo "Eval runs started in the last 24 hours: $count (EVALS_DAILY_MAX=$MAX)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$IGNORE" = "true" ]; then
            echo "ignore_daily_cap is set: running anyway." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$count" -ge "$MAX" ]; then
            msg="Eval daily cap reached: $count runs in the last 24 hours (EVALS_DAILY_MAX=$MAX). Dispatch with ignore_daily_cap, or raise the repository variable."
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi

  eval:
    name: eval
    needs: budget
    # Fork PRs get no secrets, so they never run.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.label.name == 'eval')
    runs-on: ubuntu-latest
    # More epochs than the quick tier's own take the full tier's limits. The
    # quick tier's three Claude models, opus among them, get an hour and a half.
    timeout-minutes: ${{ (inputs.tier == 'full' || inputs.epochs) && 360 || 105 }}
    permissions:
      contents: read
      actions: read # download an earlier run's logs to resume
    # A PR runs every task here, each on its own runner; a dispatch, its own.
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.task) || '["fastapi-middleware", "spec-questions"]') }}
    env:
      TIER: ${{ inputs.tier || 'quick' }}
      TASK_ID: ${{ matrix.task }}
      CORPUS: ${{ inputs.corpus }}
      ARMS: ${{ inputs.arms || 'ab' }}
      EPOCHS: ${{ inputs.epochs }}
      OPENROUTER: ${{ (github.event_name == 'workflow_dispatch' && inputs.openrouter) && '1' || '0' }}
      # Where panel.sh logs, under inspect/logs/: the tier, the tier's A/A
      # round, the assist or tools arm's round, or calibration.
      RUN_NAME: ${{ inputs.arms == 'baseline' && 'calibration' || format('{0}{1}', inputs.tier || 'quick', inputs.arms == 'aa' && '-aa' || inputs.arms == 'assist' && '-assist' || inputs.arms == 'tools' && '-tools' || '') }}
      # Each sandbox is one Docker network; the daemon below gets 256 of
      # them. The runner's 4 vCPU set the limit: at 20 sandboxes, samples
      # spent three quarters of their wall time waiting, which skews the
      # time measure. 8 is Inspect's own default for 4 CPUs.
      MAX_SANDBOXES: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the task and arms
        run: |
          [[ "$TASK_ID" =~ ^[a-z0-9][a-z0-9-]*$ && -f "evals/tasks/$TASK_ID/task.json" ]] \
            || { echo "task must be a directory under evals/tasks/" >&2; exit 1; }
          [[ "$ARMS" != baseline || "$TIER" == quick ]] || { echo "calibrate (arms: baseline) on the quick tier" >&2; exit 1; }
          # A size-dial task logs under <task>-<size> (panel.sh); LOG_TASK
          # names that directory and the artifacts.
          task="evals/tasks/$TASK_ID/task.json"
          if [[ "$(jq -r '.kind // ""' "$task")" == corpus ]]; then
            size="${CORPUS:-$(jq -r .corpus.default "$task")}"
            jq -e --arg s "$size" '.corpus.sizes | has($s)' "$task" >/dev/null \
              || { echo "corpus must be one of $(jq -r '.corpus.sizes | keys | join(", ")' "$task")" >&2; exit 1; }
            { echo "CORPUS=$size"; echo "LOG_TASK=$TASK_ID-$size"; } >> "$GITHUB_ENV"
          else
            [[ -z "$CORPUS" ]] || { echo "$TASK_ID has no corpus sizes; leave corpus empty" >&2; exit 1; }
            echo "LOG_TASK=$TASK_ID" >> "$GITHUB_ENV"
          fi
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p codecite
      # A replay task's project is its own repository at the task's base; a
      # size-dial task's sources are fetched by prepare.sh, from its manifest.
      - name: Fetch identity-model at the task's pinned commit
        run: |
          task="evals/tasks/$TASK_ID/task.json"
          [[ "$(jq -r '.kind // ""' "$task")" != corpus ]] || exit 0
          if [[ "$(jq -r '.kind // ""' "$task")" == replay ]]; then
            repo="$RUNNER_TEMP/replay"
            git init -q "$repo"
            git -C "$repo" fetch -q --depth 1 "$(jq -r .url "$task")" "$(jq -r .base "$task")"
            echo "REPLAY_REPO=$repo" >> "$GITHUB_ENV"
            exit 0
          fi
          commit="$(jq -r .corpus.commit "$task")"
          repo="$RUNNER_TEMP/identity-model"
          git init -q "$repo"
          git -C "$repo" fetch -q --depth 1 https://github.com/jamescrowley321/identity-model "$commit"
          echo "IDENTITY_MODEL_REPO=$repo" >> "$GITHUB_ENV"
      - run: evals/inspect/prepare.sh "$TASK_ID"
      # The key is the hash of every file the two images are built from, so
      # it covers the codecite binary and the identity-model commit.
      - name: Hash the image build contexts
        id: context
        run: |
          hash="$(find evals/inspect/build evals/inspect/compose.yaml evals/inspect/proxy evals/fixtures/node-oidc -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-32)"
          echo "key=evals-images-$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the sandbox images
        id: images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/images
          key: ${{ steps.context.outputs.key }}
      # Docker's default pools hold about 31 networks; /24s out of one /16
      # hold 256, enough for every sandbox at once (#111).
      - name: Give the Docker daemon small address pools
        run: |
          conf=/etc/docker/daemon.json
          current="$(sudo cat "$conf" 2>/dev/null || echo '{}')"
          jq '. + {"default-address-pools": [{"base": "10.200.0.0/16", "size": 24}]}' <<<"$current" | sudo tee "$conf"
          sudo systemctl restart docker
          docker info --format '{{.Name}} up'
      - name: Load the sandbox images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/images/images.tar"
      - name: Build the sandbox images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          docker compose -f evals/inspect/compose.yaml build
          mkdir -p "$RUNNER_TEMP/images"
          docker save -o "$RUNNER_TEMP/images/images.tar" codecite-eval-sandbox codecite-eval-idp codecite-eval-proxy
      - name: Install uv
        run: pipx install uv==0.12.5
      - run: uv sync --locked
        working-directory: evals
      - name: Fetch the logs to resume
        if: inputs.resume != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME: ${{ inputs.resume }}
        run: |
          [[ "$RESUME" =~ ^[0-9]+$ ]] || { echo "resume must be a run id" >&2; exit 1; }
          gh run download "$RESUME" -R "$GITHUB_REPOSITORY" -n "eval-logs-$RUN_NAME-$LOG_TASK" -D "evals/inspect/logs/$RUN_NAME/$LOG_TASK"
          echo RETRY=1 >> "$GITHUB_ENV"
      - name: Run the ${{ env.TIER }} tier on ${{ env.LOG_TASK }} (arms ${{ env.ARMS }})
        timeout-minutes: ${{ (inputs.tier == 'full' || inputs.epochs) && 345 || 90 }}
        working-directory: evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER == '1' && secrets.OPENROUTER_EVAL_API_KEY || '' }}
        run: inspect/panel.sh "$TIER" --sandbox-prebuilt
      # The logs keep the agents' output and the agent runs as root beside
      # the Claude token, so no log leaves the runner until the scrub
      # (evals/src/codecite_evals/scrub.py) has read it through. It deletes
      # a log holding the token in any form, or one it can't read; if the
      # scrub itself fails, every log goes, and the steps below upload only
      # after it passes.
      - name: Keep the token out of the logs
        id: scrub
        if: always()
        working-directory: evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          dir="inspect/logs/$RUN_NAME/$LOG_TASK"
          [[ -d "$dir" ]] || exit 0
          uv run --locked python -I -m codecite_evals.scrub "$dir" \
            || { echo "::error::the scrub removed a log or failed, so no logs upload"; rm -rf "$dir"; exit 1; }
      - name: Publish the scorecard
        if: always() && steps.scrub.outcome == 'success'
        run: |
          card="evals/inspect/logs/$RUN_NAME/$LOG_TASK/scorecard.md"
          [[ -s "$card" ]] || exit 0
          cat "$card" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: eval-logs-${{ env.RUN_NAME }}-${{ env.LOG_TASK }}
          path: evals/inspect/logs/${{ env.RUN_NAME }}/${{ env.LOG_TASK }}
          if-no-files-found: ignore
          overwrite: true
      # The comment job joins every task's scorecard into one comment.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.scrub.outcome == 'success' && github.event_name == 'pull_request'
        with:
          name: scorecard-${{ env.LOG_TASK }}
          path: evals/inspect/logs/${{ env.RUN_NAME }}/${{ env.LOG_TASK }}/scorecard.md
          if-no-files-found: ignore
          overwrite: true

  # Kept apart so the job holding the eval key can't write to the PR.
  comment:
    name: comment
    needs: eval
    if: always() && github.event_name == 'pull_request' && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no task got as far as a scorecard
        with:
          pattern: scorecard-*
          path: scorecards
      - name: Post or update the scorecard comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          cards=(scorecards/scorecard-*/scorecard.md)
          ((${#cards[@]})) || { echo "no scorecards" >&2; exit 0; }
          SCORECARD="$(for card in "${cards[@]}"; do cat "$card"; echo; done)"
          marker='<!-- codecite-eval-scorecard -->'
          body="$(printf '%s\n## A/B eval\n\n%s\n\nAt %s. Logs: [run](%s).\n' "$marker" "$SCORECARD" "$HEAD_SHA" "$RUN_URL")"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
