name: Evals

# The A/B agent eval (evals/README.md). The quick tier runs when a PR gets
# the `eval` label, once: pushes don't rerun it, so take the label off and
# put it back, or dispatch, to run it again. It runs one job per task in the
# eval job's matrix and posts their scorecards as one PR comment, updated in
# place; the full tier runs on dispatch, for the one task it names.
#
# Every run has Claude Code on the Claude panel, on the subscription behind
# CLAUDE_CODE_OAUTH_TOKEN. pi on the OpenRouter panel, billed per token, runs
# beside it only when switched on: the dispatch's `openrouter` input, or the
# repository variable EVALS_OPENROUTER set to `true` (for PR runs too). A dispatch with `arms: baseline`
# calibrates its task: the quick panel on the baseline arm alone, reported with
# no verdict (evals/README.md). Advisory, like `bench`: never a required check.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tier:
        description: quick (2 Claude models, 5 epochs) or full (2 Claude models, 10 epochs); OpenRouter adds 3 or 9 models
        type: choice
        options: [quick, full]
        default: quick
      task:
        description: The task to run, a directory under evals/tasks/
        type: string
        default: fastapi-middleware
      arms:
        description: ab (baseline against codecite), aa (an A/A round, two baseline arms, to measure noise) or baseline (calibrate the task on the quick tier, no verdict)
        type: choice
        options: [ab, aa, baseline]
        default: ab
      epochs:
        description: Epochs per arm, if not the tier's own (quick 5, full 10)
        type: string
        default: ""
      openrouter:
        description: Also run pi on the tier's OpenRouter panel, billed per token
        type: boolean
        default: false
      resume:
        description: Run id of an earlier run of this tier, task and arms whose unfinished logs to finish with inspect eval-retry
        type: string
        default: ""

permissions:
  contents: read

# Labelling a PR again cancels its stale eval. Events that run nothing (any
# other label) get a group of their own, so they cancel nothing. Dispatches queue rather than cancel, one group per set of
# inputs (task, tier, arms, epochs, openrouter, resume): GitHub keeps one pending run per
# group and cancels the one before, so without the task, calibrating two tasks
# at once dropped the first. Only an identical dispatch replaces a pending one.
concurrency:
  group: >-
    evals-${{ github.event.pull_request.number || github.ref }}-${{ inputs.task || 'pr' }}-${{ inputs.tier || 'quick' }}-${{ inputs.arms || 'ab' }}-${{ inputs.epochs || 'default' }}-${{ inputs.openrouter && 'or' || 'claude' }}-${{ inputs.resume || 'fresh' }}-${{
    (github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval')
    && 'run' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  eval:
    name: eval
    # Fork PRs get no secrets, so they never run.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.label.name == 'eval')
    runs-on: ubuntu-latest
    # More epochs than the quick tier's own take the full tier's limits.
    timeout-minutes: ${{ (inputs.tier == 'full' || inputs.epochs) && 360 || 75 }}
    permissions:
      contents: read
      actions: read # download an earlier run's logs to resume
    # A PR runs every task here, each on its own runner; a dispatch, its own.
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.task) || '["fastapi-middleware", "spec-questions"]') }}
    env:
      TIER: ${{ inputs.tier || 'quick' }}
      TASK_ID: ${{ matrix.task }}
      ARMS: ${{ inputs.arms || 'ab' }}
      EPOCHS: ${{ inputs.epochs }}
      OPENROUTER: ${{ (inputs.openrouter || vars.EVALS_OPENROUTER == 'true') && '1' || '0' }}
      # Where panel.sh logs, under inspect/logs/: the tier, the tier's A/A
      # round, or calibration.
      RUN_NAME: ${{ inputs.arms == 'baseline' && 'calibration' || format('{0}{1}', inputs.tier || 'quick', inputs.arms == 'aa' && '-aa' || '') }}
      # Each sandbox is one Docker network; the daemon below gets 256 of
      # them. The runner's 4 vCPU set the limit: at 20 sandboxes, samples
      # spent three quarters of their wall time waiting, which skews the
      # time measure. 8 is Inspect's own default for 4 CPUs.
      MAX_SANDBOXES: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the task and arms
        run: |
          [[ "$TASK_ID" =~ ^[a-z0-9][a-z0-9-]*$ && -f "evals/tasks/$TASK_ID/task.json" ]] \
            || { echo "task must be a directory under evals/tasks/" >&2; exit 1; }
          [[ "$ARMS" != baseline || "$TIER" == quick ]] || { echo "calibrate (arms: baseline) on the quick tier" >&2; exit 1; }
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p codecite
      - name: Fetch identity-model at the task's pinned commit
        run: |
          commit="$(jq -r .corpus.commit "evals/tasks/$TASK_ID/task.json")"
          repo="$RUNNER_TEMP/identity-model"
          git init -q "$repo"
          git -C "$repo" fetch -q --depth 1 https://github.com/jamescrowley321/identity-model "$commit"
          echo "IDENTITY_MODEL_REPO=$repo" >> "$GITHUB_ENV"
      - run: evals/inspect/prepare.sh "$TASK_ID"
      # The key is the hash of every file the two images are built from, so
      # it covers the codecite binary and the identity-model commit.
      - name: Hash the image build contexts
        id: context
        run: |
          hash="$(find evals/inspect/build evals/inspect/compose.yaml evals/inspect/proxy evals/fixtures/node-oidc -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-32)"
          echo "key=evals-images-$hash" >> "$GITHUB_OUTPUT"
      - name: Restore the sandbox images
        id: images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/images
          key: ${{ steps.context.outputs.key }}
      # Docker's default pools hold about 31 networks; /24s out of one /16
      # hold 256, enough for every sandbox at once (#111).
      - name: Give the Docker daemon small address pools
        run: |
          conf=/etc/docker/daemon.json
          current="$(sudo cat "$conf" 2>/dev/null || echo '{}')"
          jq '. + {"default-address-pools": [{"base": "10.200.0.0/16", "size": 24}]}' <<<"$current" | sudo tee "$conf"
          sudo systemctl restart docker
          docker info --format '{{.Name}} up'
      - name: Load the sandbox images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/images/images.tar"
      - name: Build the sandbox images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          docker compose -f evals/inspect/compose.yaml build
          mkdir -p "$RUNNER_TEMP/images"
          docker save -o "$RUNNER_TEMP/images/images.tar" codecite-eval-sandbox codecite-eval-idp codecite-eval-proxy
      - name: Install uv
        run: pipx install uv==0.12.5
      - run: uv sync --locked
        working-directory: evals
      - name: Fetch the logs to resume
        if: inputs.resume != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME: ${{ inputs.resume }}
        run: |
          [[ "$RESUME" =~ ^[0-9]+$ ]] || { echo "resume must be a run id" >&2; exit 1; }
          gh run download "$RESUME" -R "$GITHUB_REPOSITORY" -n "eval-logs-$RUN_NAME-$TASK_ID" -D "evals/inspect/logs/$RUN_NAME/$TASK_ID"
          echo RETRY=1 >> "$GITHUB_ENV"
      - name: Run the ${{ env.TIER }} tier on ${{ env.TASK_ID }} (arms ${{ env.ARMS }})
        timeout-minutes: ${{ (inputs.tier == 'full' || inputs.epochs) && 345 || 60 }}
        working-directory: evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER == '1' && secrets.OPENROUTER_EVAL_API_KEY || '' }}
        run: inspect/panel.sh "$TIER" --sandbox-prebuilt
      # The logs keep the agents' output and the agent runs as root beside
      # the Claude token, so no log leaves the runner until the scrub
      # (evals/src/codecite_evals/scrub.py) has read it through. It deletes
      # a log holding the token in any form, or one it can't read; if the
      # scrub itself fails, every log goes, and the steps below upload only
      # after it passes.
      - name: Keep the token out of the logs
        id: scrub
        if: always()
        working-directory: evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          dir="inspect/logs/$RUN_NAME/$TASK_ID"
          [[ -d "$dir" ]] || exit 0
          uv run --locked python -I -m codecite_evals.scrub "$dir" \
            || { echo "::error::the scrub removed a log or failed, so no logs upload"; rm -rf "$dir"; exit 1; }
      - name: Publish the scorecard
        if: always() && steps.scrub.outcome == 'success'
        run: |
          card="evals/inspect/logs/$RUN_NAME/$TASK_ID/scorecard.md"
          [[ -s "$card" ]] || exit 0
          cat "$card" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: eval-logs-${{ env.RUN_NAME }}-${{ env.TASK_ID }}
          path: evals/inspect/logs/${{ env.RUN_NAME }}/${{ env.TASK_ID }}
          if-no-files-found: ignore
          overwrite: true
      # The comment job joins every task's scorecard into one comment.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.scrub.outcome == 'success' && github.event_name == 'pull_request'
        with:
          name: scorecard-${{ env.TASK_ID }}
          path: evals/inspect/logs/${{ env.RUN_NAME }}/${{ env.TASK_ID }}/scorecard.md
          if-no-files-found: ignore
          overwrite: true

  # Kept apart so the job holding the eval key can't write to the PR.
  comment:
    name: comment
    needs: eval
    if: always() && github.event_name == 'pull_request' && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no task got as far as a scorecard
        with:
          pattern: scorecard-*
          path: scorecards
      - name: Post or update the scorecard comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          cards=(scorecards/scorecard-*/scorecard.md)
          ((${#cards[@]})) || { echo "no scorecards" >&2; exit 0; }
          SCORECARD="$(for card in "${cards[@]}"; do cat "$card"; echo; done)"
          marker='<!-- codecite-eval-scorecard -->'
          body="$(printf '%s\n## A/B eval\n\n%s\n\nAt %s. Logs: [run](%s).\n' "$marker" "$SCORECARD" "$HEAD_SHA" "$RUN_URL")"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
