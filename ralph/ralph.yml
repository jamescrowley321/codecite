# Ralph Orchestrator configuration for the codecite loop. Launch with ralph/run.sh.
# Docs: https://github.com/mikeyobrien/ralph-orchestrator

cli:
  backend: "claude"
  timeout: 1800  # 30 minutes per iteration; implement stops starting tasks at ~20

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "CODECITE_QUEUE_EMPTY"
  # Matched anywhere in the output text, so it must be a word no phase writes by accident.
  # About 9 phases per issue; 7 issues in General purpose plus CI and review retries.
  max_iterations: 400
  max_consecutive_failures: 5
