# Inputs for the CodeGraph reuse benchmark (#295).
#
# The repositories, split and pins are #294's (experiments/retrieval-
# generalization/corpora.toml on PR #294), so both benchmarks describe the
# same source. `split` keeps evaluation repositories, where generalization is
# claimed, apart from the Linux and Keycloak controls. #294 measured
# definitions and search on the evaluation repositories; no edge output of
# either tool on them had been read when this file and cases.json were
# frozen (README, "Split").
#
# `scip` names the standard indexer that produced the SCIP index for the
# codecite+SCIP baseline, or says why none exists. A repository without one
# has *unavailable* SCIP coverage, never zero recall. `language` and `domain`
# only describe the repository; nothing in the harness reads them.

[producer.codegraph]
package = "@colbymchenry/codegraph"
version = "1.6.0"
platform_bundle = "@colbymchenry/codegraph-linux-x64 1.6.0"
license = "MIT"
schema_version = 9                 # max(schema_versions.version)
extraction_version = "25"          # project_metadata.indexed_with_extraction_version
inclusion = "codegraph init -y <checkout> with its default include and exclude rules, run by #294's prepare.sh"

[producer.codecite]
build = "c65b4d8"                  # origin/main, release profile, --locked
sha256 = "2e0988cada0c004d9938c1a677957889eb02687b16b72bd7cb0a0cadee35e73a"

[[repo]]
name = "django"
split = "evaluation"
url = "https://github.com/django/django"
commit = "8f8ad09659d728423a00e0a3b5f16da5c3a38e24"  # tag 6.0.5
license = "BSD-3-Clause"
use = "adapt"
language = "python"
domain = "web framework and ORM"
scip = "scip-python 0.6.8 from npm, `index . --project-name django --project-version 6.0.5`, no network"
codegraph_sha256 = "749309442b28dcc2b23f0bcda6200a39a3c736fac59b2366045e32d514e2ebcc"
codegraph_init = { wall_seconds = 13.86, peak_rss_kib = 1962388, db_bytes = 157499392 }  # #294 results/index.json
scip_sha256 = "15ab0e01d9f80854e5d4daa32ab03b50a393cc86dce4ce802197c27b3437a195"

