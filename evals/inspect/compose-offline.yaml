# The sandbox without the IdP, for tasks that need none (task.json "idp":
# null and the task picks this file). Its network has no route out but the
# proxy (proxy/), which lets through api.anthropic.com alone, for Claude
# Code; pi's calls leave through Inspect's agent bridge, which needs none.
services:
  default:
    build: build
    image: codecite-eval-sandbox
    init: true
    networks: [eval]
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
    depends_on:
      proxy:
        condition: service_started
  proxy:
    build: proxy
    image: codecite-eval-proxy
    networks: [eval, egress]
networks:
  eval:
    internal: true
  egress: {}
