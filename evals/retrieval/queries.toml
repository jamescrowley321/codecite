# Labelled queries for the retrieval benchmark (`codecite-bench`). See the
# retrieval benchmark in docs/design.md.
#
# Each query lists every span that answers it on its own:
# - a spec section by number, as search cites it: `<document>#section-<n>`
#   (`openid-connect-core-1_0#section-3.1.3.7`, not the page's own
#   `#IDTokenValidation`); a step in it also counts, and
#   `<document>#section-<n>/step-<k>` names one step only;
# - a code line as `<path>#L<n>`, normally a definition's first line; a
#   result counts when it is in that file and its lines hold line n.
#
# Queries come from real tasks and agents' eval transcripts, not from the
# index. Code line numbers hold at the commit pinned in identity-bench.toml.

corpus = "identity-bench"



