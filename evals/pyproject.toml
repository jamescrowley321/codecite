[project]
name = "codecite-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.283",
    "openai>=3.37.0",
]

[project.scripts]
codecite-eval-report = "codecite_evals.report:main"
codecite-eval-frozen = "codecite_evals.frozen:main"
codecite-history-mine = "codecite_evals.history:main"

# Inspect finds the tasks here: `inspect eval codecite_evals/fastapi_middleware`.
[project.entry-points.inspect_ai]
codecite_evals = "codecite_evals._registry"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
