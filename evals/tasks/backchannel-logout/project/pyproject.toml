[project]
name = "notes-rp"
version = "0.1.0"
description = "A small notes app that signs users in with OpenID Connect"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.23.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.14.0",
    "py-identity-model",
]

[tool.uv]
package = false

[tool.uv.sources]
py-identity-model = { path = "@IDENTITY_MODEL@/py" }
