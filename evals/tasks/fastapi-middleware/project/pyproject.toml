[project]
name = "items-api"
version = "0.1.0"
description = "A small items API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.23.0",
    "fastapi-identity-model",
]

[tool.uv]
package = false

[tool.uv.sources]
fastapi-identity-model = { path = "@IDENTITY_MODEL@/py/packages/fastapi-identity-model" }
py-identity-model = { path = "@IDENTITY_MODEL@/py" }
