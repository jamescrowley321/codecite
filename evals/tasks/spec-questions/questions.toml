answer = ["login_required"]
accepted = ["openid-connect-core-1_0#section-3.1.2.6", "openid-connect-core-1_0#section-3.1.2.1"]
source = "OIDC client: silent re-auth"

[[question]]
id = "spec-plain-settings-document-path"
