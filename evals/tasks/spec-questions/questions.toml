source = "token-exchange client"

[[question]]
id = "spec-plain-swap-response-kind-member"
text = "After trading one access token for another, which response member says what kind of token came back?"
answer = ["issued_token_type"]
accepted = ["rfc8693#section-2.2.1"]
source = "token-exchange client: reading the response"

[[question]]
id = "spec-plain-swap-identity-blob-type-uri"
