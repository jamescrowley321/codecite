adapted_from = "spec-req-discovery-issuer-match"

[[question]]
id = "spec-plain-app-sign-in-fails-error"
text = "Which error does the token endpoint return when an app's own sign-in to it fails, say with a wrong secret?"
answer = ["invalid_client"]
accepted = ["rfc6749#section-5.2"]
source = "token client: mapping token endpoint error codes to exceptions"

[[question]]
id = "spec-plain-login-code-lifetime"
text = "At most how many minutes should a one-time login code stay redeemable?"
answer = ["10"]
accepted = ["rfc6749#section-4.1.2"]
source = "authorization server: issuing and redeeming authorization codes"

[[question]]
id = "spec-plain-login-code-second-use"
text = "May my app redeem the same one-time login code twice?"
answer = ["no"]
accepted = ["rfc6749#section-4.1.2", "rfc6749#section-10.5"]
