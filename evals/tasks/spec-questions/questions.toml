# Spec questions for the spec-question task (#104), asked the way an agent asks
# them: in its own words, not the spec's. `codecite_evals.spec_questions` holds the rules.
#
# Each question has:
# - `text`: the question as the agent gets it;
# - `answer`: the closed-form answer, `yes`/`no` or one name or value, with
#   every form the spec allows (any one of them is right);
# - `accepted`: the sections that support the answer, written as in
#   evals/retrieval/queries.toml, a step in an accepted section counting;
# - `source`: the real task the question comes from;
# - `adapted_from`: for a question adapted from queries.toml, that query's id.
#
# This file holds the answers. It never goes into the sandbox image: the agent
# gets only `text`, and the scorer reads the rest after the agent exits.
# A new question that also works as a retrieval query is in queries.toml too,
# under the same id.

[[question]]
id = "spec-plain-echoed-login-value-checked"
text = "If my app put a random one-off value in the sign-in request, must it confirm the identity blob it gets back carries that same value?"
answer = ["yes"]
accepted = ["openid-connect-core-1_0#section-3.1.3.7"]
source = "OIDC client: ID token validation"
adapted_from = "spec-req-nonce-check-mandatory"

[[question]]
id = "spec-plain-wrong-login-secret-error"
text = "Which error does the provider return when the secret my app shows while redeeming a login code doesn't fit the hash it sent at the start?"
answer = ["invalid_grant"]
accepted = ["rfc7636#section-4.6"]
source = "authorization server: token endpoint PKCE check"
adapted_from = "spec-req-pkce-verifier-mismatch"

[[question]]
id = "spec-plain-cancel-credential-prove-identity"
text = "Does an app that has its own secret need to prove who it is when asking the provider to cancel a credential?"
answer = ["yes"]
accepted = ["rfc7009#section-2.1"]
source = "revocation client"
adapted_from = "spec-req-revocation-client-auth"

[[question]]
id = "spec-plain-unknown-must-understand-extension"
text = "If a signed object's header lists an extension as must-understand and my verifier doesn't know it, may my code still treat the signature as valid?"
answer = ["no"]
accepted = ["rfc7515#section-4.1.11"]
source = "JWS verification: header processing"
adapted_from = "spec-req-jws-crit-header"

[[question]]
id = "spec-plain-backend-app-one-off-secret"
text = "Is a backend web app that keeps its own secret still advised to bind each sign-in to a one-off secret it reveals only when redeeming the code?"
answer = ["yes"]
accepted = ["rfc9700#section-2.1.1"]
source = "OAuth client: deciding when to send PKCE"
adapted_from = "spec-req-pkce-confidential-clients"

[[question]]
id = "spec-plain-anonymous-liveness-check"
text = "May any anonymous caller ask the provider whether a credential is still live?"
answer = ["no"]
accepted = ["rfc7662#section-2.1"]
source = "introspection client: credentials for the call"
adapted_from = "spec-req-introspection-caller-auth"

[[question]]
id = "spec-plain-throwaway-secret-shortest"
text = "At the least, how long is the throwaway secret an app makes up before each sign-in?"
answer = ["43"]
accepted = ["rfc7636#section-4.1"]
source = "PKCE: generating the verifier"
adapted_from = "spec-plain-throwaway-secret-length"

[[question]]
id = "spec-plain-turn-away-header"
text = "Which response header must my API include when it turns away a call that arrived with no credential?"
answer = ["WWW-Authenticate"]
accepted = ["rfc6750#section-3"]
source = "resource server middleware: rejecting requests"
adapted_from = "spec-plain-reply-to-missing-credential"

[[question]]
id = "spec-plain-gadget-default-wait"
text = "If the provider never said how often a living-room gadget may re-check, how many seconds must it pause between checks?"
answer = ["5"]
accepted = ["rfc8628#section-3.5", "rfc8628#section-3.2"]
source = "device flow: polling interval"
adapted_from = "spec-plain-gadget-recheck-frequency"

[[question]]
id = "spec-plain-not-meant-for-my-service"
text = "If my service isn't named as one of the parties a signed claims set is meant for, must it refuse the set?"
answer = ["yes"]
accepted = ["rfc7519#section-4.1.3"]
source = "JWT validation library"
adapted_from = "spec-req-aud-claim-validation"

[[question]]
id = "spec-plain-keep-working-scope"
text = "Which scope value do I ask for so my app can keep working for someone after they've closed the browser?"
answer = ["offline_access"]
accepted = ["openid-connect-core-1_0#section-11"]
source = "OIDC client: requesting refresh tokens"
adapted_from = "spec-plain-keep-working-after-browser-closed"

[[question]]
id = "spec-plain-settings-name-matches-base"
text = "Must the provider name inside its fetched settings document be exactly the base address I built the fetch URL from?"
answer = ["yes"]
accepted = ["openid-connect-discovery-1_0#section-4.3", "rfc8414#section-3.3"]
