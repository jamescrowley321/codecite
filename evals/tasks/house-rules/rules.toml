# The rule layer house-rules exercises: identity-stack's rules at the pinned
# commit, where each is stated, and what decides it. `kind` is the issue's mix:
# `house` (an arbitrary house choice, followed only by finding it), `habit`
# (against common habit) or `control` (best practice, which both arms should
# keep; checks.py reports control rules apart and never fails a run on one).
# `checked` names the checks.py checks, or hidden tests, that decide a rule;
# a rule with none is left to review. `citation` is a `codecite read`
# citation into the `eval` corpus, which the sandbox image resolves for every
# rule when it is built (prepare.sh stages them in citations.txt), so each
# resolves at every size.

