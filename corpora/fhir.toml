# Servers and libraries, each at the commit its default branch pointed to when
# added. The three largest leave out their JSON and XML: almost all of it is
# FHIR fixtures and definitions, about 930 MiB that took the corpus file from
# 3.1 GB to 6.8 GB.

[[source]]
kind = "git"
url = "https://github.com/hapifhir/hapi-fhir"
commit = "4b491718d6504a84978a6a6418ae35ce369a595f"
license = "Apache-2.0"
use = "adapt"
exclude = ["**/*.json", "**/*.xml", "**/*.xsd", "**/*.sch"]

