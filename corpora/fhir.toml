# The fhir corpus: open-source FHIR servers and libraries, and the pages of
# the FHIR R4 (4.0.1) specification a server implements first.
#
# Index it with `codecite index fhir`. Git sources are pinned by commit;
# `codecite add fhir <url>` adds one at its remote's current commit. Documents
# are pinned by the sha256 of their bytes; `codecite index fhir
# --print-hashes` prints the hash each URL serves now.
#
# Java and Clojure have no grammar here, so HAPI FHIR and Blaze index as
# plain text in 60-line windows, not at their definitions.

name = "fhir"

# FHIR R4 (4.0.1), from hl7.org. The specification is published under CC0.

