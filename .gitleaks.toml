# gitleaks config: the default rules plus narrow allowlists. Scope each one to
# a rule, a file and a value shape, so a real secret beside them still fails.
# (A top-level [[allowlists]] with `paths` skips the whole file, AND or not.)
[extend]
useDefault = true

# The embeddings spike's model lock maps file names to sha256 digests, and
# generic-api-key fires on keys like "tokenizer.json" beside a 64-hex value.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "sha256 digests in the embeddings spike's model lock"
condition = "AND"
# Both paths: the lock moved, and gitleaks scans each commit in the PR.
paths = ['''^(evals/retrieval/embeddings-spike|experiments/spec-retrieval)/models\.lock\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

# RFC 6749's published example credentials (`client_secret=7Fjfp0ZBr1KtDRbnfVdmIw`,
# `"access_token":"2YotnFZFEjr1zCsicMWpAA"`) in its pinned page, kept unmodified
# as a test fixture. A path, not commit fingerprints, so it holds after the squash
# merge; the page can't change unnoticed, since the requirements tests index it
# against its pinned sha256 and fail on any other bytes. The replay task of
# #167 carries the same examples in its reference fix, which added the page.
[[rules.allowlists]]
description = "RFC 6749's example credentials in its pinned page"
condition = "AND"
paths = [
  '''^crates/codecite-index/tests/fixtures/spec/rfc6749\.html$''',
  '''^evals/tasks/replay-codecite-167/reference/fix\.patch$''',
]
regexTarget = "secret"
regexes = ['''^(7Fjfp0ZBr1KtDRbnfVdmIw|2YotnFZFEjr1zCsicMWpAA|tGzv3JOkF0XG5Qx2TlKWIA)$''']

# identity-model's DPoP test vectors (`spec/vectors/dpop.json`): JWTs signed
# with throwaway test keys, carried in the reference fix of the replay task
# of identity-model #826.
[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "identity-model's DPoP test vectors in a replay task's reference fix"
condition = "AND"
paths = ['''^evals/tasks/replay-identity-model-826/reference/fix\.patch$''']
regexTarget = "secret"
regexes = ['''^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.?[A-Za-z0-9_-]*$''']
