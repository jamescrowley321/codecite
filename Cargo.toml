[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/jamescrowley321/codecite"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# The internal crates' versions must match `workspace.package.version`: for
# 0.0.x, Cargo treats "0.0.1" as exactly =0.0.1, so a bump changes all five.
codecite-core = { path = "crates/codecite-core", version = "0.0.1" }
codecite-index = { path = "crates/codecite-index", version = "0.0.1" }
codecite-lsp = { path = "crates/codecite-lsp", version = "0.0.1" }
codecite-mcp = { path = "crates/codecite-mcp", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
directories = "6"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
globset = "0.4"
regex = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
streaming-iterator = "0.1"
tempfile = "3"
scraper = { version = "0.29", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ego-tree = "0.11"
proptest = { version = "1", default-features = false, features = ["std"] }
schemars = "1"
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
jsonschema = { version = "0.60", default-features = false }
spdx = { version = "0.13", default-features = false, features = ["detection"] }
